sonar.organization=dbildungsplattform
sonar.projectKey=dBildungsplattform_schulportal-client
# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=schulportal-client
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.integration-spec.ts
sonar.test.exclusions=**/node_modules/**
# This excludes helper/mock files from coverage metrics only, NOT from code analysis or test detection
sonar.exclusions=**/lcov-report/**,src/api-client/**,test/**,eslint.config.*,*.eslintrc.*,vite.config.*,vitest.setup.ts
sonar.coverage.exclusions=src/api-client/**,src/plugins/**,src/services/**,src/router/**,/vitest.setup.ts,src/App.vue,src/main.ts
sonar.cpd.exclusions=src/router/routes.ts

# Coverage threshold levels are enforced by the SonarCloud Quality Gate (project settings), not this file.
# Location for the coverage report files
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8